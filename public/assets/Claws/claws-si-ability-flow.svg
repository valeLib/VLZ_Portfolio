<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <!-- Ability flow schematic: a card applies a modifier to the ball, the shot resolves into an effect -->
  <defs>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="2.2" fill="#1A1520" opacity="0.07"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1520"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#FFFDF8"/>
  <rect width="900" height="600" fill="url(#dots)"/>

  <!-- Card -->
  <g transform="translate(95,140)">
    <rect x="10" y="10" width="170" height="230" rx="18" fill="#1A1520"/>
    <rect x="0" y="0" width="170" height="230" rx="18" fill="#CCCCFF" stroke="#1A1520" stroke-width="5"/>
    <rect x="15" y="15" width="140" height="200" rx="12" fill="none" stroke="#1A1520" stroke-width="2.5" opacity="0.35" stroke-dasharray="8 7"/>
    <circle cx="85" cy="92" r="42" fill="#FFFDF8" stroke="#1A1520" stroke-width="5"/>
    <path d="M85,66 L93,84 L113,86 L98,99 L103,119 L85,108 L67,119 L72,99 L57,86 L77,84 Z" fill="#FABA32" stroke="#1A1520" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="35" y="162" width="100" height="10" rx="5" fill="#1A1520" opacity="0.18"/>
    <rect x="35" y="184" width="72" height="10" rx="5" fill="#1A1520" opacity="0.18"/>
  </g>

  <!-- Arrow card -> ball -->
  <line x1="300" y1="255" x2="352" y2="255" stroke="#1A1520" stroke-width="6" marker-end="url(#ah)"/>

  <!-- Ball with active modifier -->
  <g transform="translate(475,255)">
    <circle r="104" fill="none" stroke="#D4DF68" stroke-width="8" stroke-dasharray="18 14"/>
    <g stroke="#FABA32" stroke-width="6" stroke-linecap="round">
      <line x1="-88" y1="-88" x2="-72" y2="-72"/>
      <line x1="88" y1="-88" x2="72" y2="-72"/>
      <line x1="-88" y1="88" x2="-72" y2="72"/>
      <line x1="88" y1="88" x2="72" y2="72"/>
    </g>
    <circle cx="6" cy="6" r="76" fill="#1A1520"/>
    <circle r="76" fill="#FFFDF8" stroke="#1A1520" stroke-width="6"/>
    <ellipse cx="-26" cy="-30" rx="18" ry="12" fill="#1A1520" opacity="0.1" transform="rotate(-30 -26 -30)"/>
    <path d="M34,-86 C22,-98 28,-112 40,-124 C42,-112 54,-112 52,-100 C62,-106 60,-90 48,-84 C44,-82 38,-82 34,-86 Z" fill="#EE978E" stroke="#1A1520" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- Arrow ball -> effect -->
  <line x1="610" y1="255" x2="662" y2="255" stroke="#1A1520" stroke-width="6" marker-end="url(#ah)"/>

  <!-- Resolved effect burst -->
  <g transform="translate(768,255)">
    <circle r="98" fill="none" stroke="#1A1520" stroke-width="3" stroke-dasharray="6 10" opacity="0.4"/>
    <g transform="translate(5,5)">
      <path d="M0,-74 L16,-32 L58,-46 L30,-12 L74,0 L30,12 L58,46 L16,32 L0,74 L-16,32 L-58,46 L-30,12 L-74,0 L-30,-12 L-58,-46 L-16,-32 Z" fill="#1A1520"/>
    </g>
    <path d="M0,-74 L16,-32 L58,-46 L30,-12 L74,0 L30,12 L58,46 L16,32 L0,74 L-16,32 L-58,46 L-30,12 L-74,0 L-30,-12 L-58,-46 L-16,-32 Z" fill="#EE978E" stroke="#1A1520" stroke-width="5" stroke-linejoin="round"/>
    <circle r="22" fill="#FFFDF8" stroke="#1A1520" stroke-width="4"/>
  </g>

  <!-- Caption chips -->
  <g font-family="'Courier New', monospace" font-weight="bold" font-size="24" fill="#1A1520" text-anchor="middle">
    <g transform="translate(180,505)">
      <rect x="-71" y="-22" width="150" height="52" rx="26" fill="#1A1520"/>
      <rect x="-75" y="-26" width="150" height="52" rx="26" fill="#FFFDF8" stroke="#1A1520" stroke-width="4"/>
      <text y="9">CARD</text>
    </g>
    <g transform="translate(475,505)">
      <rect x="-91" y="-22" width="190" height="52" rx="26" fill="#1A1520"/>
      <rect x="-95" y="-26" width="190" height="52" rx="26" fill="#D4DF68" stroke="#1A1520" stroke-width="4"/>
      <text y="9">MODIFIER</text>
    </g>
    <g transform="translate(768,505)">
      <rect x="-76" y="-22" width="160" height="52" rx="26" fill="#1A1520"/>
      <rect x="-80" y="-26" width="160" height="52" rx="26" fill="#FFFDF8" stroke="#1A1520" stroke-width="4"/>
      <text y="9">EFFECT</text>
    </g>
  </g>
</svg>
