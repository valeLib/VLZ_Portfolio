<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <!-- Ball ability framework: one ball, many attachable modifiers -->
  <defs>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="2.2" fill="#1A1520" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="900" height="600" fill="#FFFDF8"/>
  <rect width="900" height="600" fill="url(#dots)"/>

  <!-- Connectors -->
  <g stroke="#1A1520" stroke-width="3.5" stroke-dasharray="9 8" opacity="0.55">
    <line x1="450" y1="140" x2="450" y2="200"/>
    <line x1="612" y1="205" x2="527" y2="252"/>
    <line x1="612" y1="375" x2="527" y2="328"/>
    <line x1="450" y1="440" x2="450" y2="380"/>
    <line x1="288" y1="375" x2="373" y2="328"/>
    <line x1="288" y1="205" x2="373" y2="252"/>
  </g>

  <!-- Central ball -->
  <g transform="translate(450,290)">
    <circle cx="7" cy="7" r="90" fill="#1A1520"/>
    <circle r="90" fill="#FFFDF8" stroke="#1A1520" stroke-width="6"/>
    <ellipse cx="-30" cy="-34" rx="22" ry="14" fill="#1A1520" opacity="0.1" transform="rotate(-30 -30 -34)"/>
    <circle r="34" fill="#F5EEE6" stroke="#1A1520" stroke-width="4"/>
    <path d="M-12,10 C-12,-2 -4,-8 0,-14 C4,-8 12,-2 12,10 A12,10 0 0 1 -12,10 Z" fill="#1A1520"/>
    <circle cx="-14" cy="-4" r="5" fill="#1A1520"/>
    <circle cx="14" cy="-4" r="5" fill="#1A1520"/>
  </g>

  <!-- Fire -->
  <g transform="translate(450,90)">
    <circle cx="5" cy="5" r="50" fill="#1A1520"/>
    <circle r="50" fill="#EE978E" stroke="#1A1520" stroke-width="5"/>
    <path d="M0,30 C-20,22 -24,4 -12,-8 C-10,0 -4,2 -2,-4 C0,-14 -6,-18 2,-30 C6,-16 18,-14 20,0 C22,14 14,26 0,30 Z" fill="#FFFDF8" stroke="#1A1520" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  <!-- Ice -->
  <g transform="translate(617,187)">
    <circle cx="5" cy="5" r="50" fill="#1A1520"/>
    <circle r="50" fill="#8BD9C3" stroke="#1A1520" stroke-width="5"/>
    <g stroke="#1A1520" stroke-width="4.5" stroke-linecap="round">
      <line x1="0" y1="-28" x2="0" y2="28"/>
      <line x1="-24" y1="-14" x2="24" y2="14"/>
      <line x1="-24" y1="14" x2="24" y2="-14"/>
      <line x1="-6" y1="-20" x2="0" y2="-28"/><line x1="6" y1="-20" x2="0" y2="-28"/>
      <line x1="-6" y1="20" x2="0" y2="28"/><line x1="6" y1="20" x2="0" y2="28"/>
    </g>
  </g>
  <!-- Explosion -->
  <g transform="translate(617,393)">
    <circle cx="5" cy="5" r="50" fill="#1A1520"/>
    <circle r="50" fill="#FABA32" stroke="#1A1520" stroke-width="5"/>
    <path d="M0,-30 L8,-10 L28,-16 L16,0 L28,16 L8,10 L0,30 L-8,10 L-28,16 L-16,0 L-28,-16 L-8,-10 Z" fill="#FFFDF8" stroke="#1A1520" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  <!-- Size -->
  <g transform="translate(450,490)">
    <circle cx="5" cy="5" r="50" fill="#1A1520"/>
    <circle r="50" fill="#D4DF68" stroke="#1A1520" stroke-width="5"/>
    <g stroke="#1A1520" stroke-width="5" stroke-linecap="round" fill="#1A1520">
      <line x1="-8" y1="8" x2="-24" y2="24"/>
      <path d="M-28,28 L-26,14 L-14,26 Z"/>
      <line x1="8" y1="-8" x2="24" y2="-24"/>
      <path d="M28,-28 L26,-14 L14,-26 Z"/>
    </g>
  </g>
  <!-- Ricochet -->
  <g transform="translate(283,393)">
    <circle cx="5" cy="5" r="50" fill="#1A1520"/>
    <circle r="50" fill="#CCCCFF" stroke="#1A1520" stroke-width="5"/>
    <polyline points="-28,18 -10,-14 8,10 26,-16" fill="none" stroke="#1A1520" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30,-22 L28,-8 L16,-18 Z" fill="#1A1520"/>
  </g>
  <!-- Orbit -->
  <g transform="translate(283,187)">
    <circle cx="5" cy="5" r="50" fill="#1A1520"/>
    <circle r="50" fill="#F5EEE6" stroke="#1A1520" stroke-width="5"/>
    <circle r="16" fill="#FFFDF8" stroke="#1A1520" stroke-width="4"/>
    <ellipse rx="34" ry="13" fill="none" stroke="#1A1520" stroke-width="4" transform="rotate(-24)"/>
    <circle cx="-30" cy="-13" r="8" fill="#4F58AF" stroke="#1A1520" stroke-width="3"/>
  </g>
</svg>
