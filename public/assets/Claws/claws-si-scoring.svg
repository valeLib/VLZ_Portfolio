<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <!-- Scoring and run progression: score, streaks, pockets, goal, lives -->
  <defs>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="2.2" fill="#1A1520" opacity="0.07"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1520"/>
    </marker>
  </defs>
  <rect width="900" height="600" fill="#FFFDF8"/>
  <rect width="900" height="600" fill="url(#dots)"/>

  <!-- Score panel -->
  <g transform="translate(85,95)">
    <rect x="8" y="8" width="330" height="170" rx="20" fill="#1A1520"/>
    <rect x="0" y="0" width="330" height="170" rx="20" fill="#FFFDF8" stroke="#1A1520" stroke-width="6"/>
    <text x="28" y="55" font-family="'Courier New', monospace" font-weight="bold" font-size="28" fill="#4F58AF">SCORE</text>
    <text x="26" y="138" font-family="'Courier New', monospace" font-weight="bold" font-size="76" fill="#1A1520">1250</text>
  </g>

  <!-- Streak chips -->
  <g font-family="'Courier New', monospace" font-weight="bold" font-size="34" text-anchor="middle" fill="#1A1520">
    <g transform="translate(140,372)">
      <circle cx="5" cy="5" r="46" fill="#1A1520"/>
      <circle r="46" fill="#D4DF68" stroke="#1A1520" stroke-width="5"/>
      <text y="12">x2</text>
    </g>
    <g transform="translate(258,372)">
      <circle cx="5" cy="5" r="46" fill="#1A1520"/>
      <circle r="46" fill="#FABA32" stroke="#1A1520" stroke-width="5"/>
      <text y="12">x3</text>
    </g>
    <g transform="translate(376,372)">
      <circle cx="5" cy="5" r="46" fill="#1A1520"/>
      <circle r="46" fill="#EE978E" stroke="#1A1520" stroke-width="5"/>
      <text y="12">x5</text>
    </g>
  </g>

  <!-- Balls run into the pocket -->
  <path d="M560,160 Q740,170 806,258" fill="none" stroke="#1A1520" stroke-width="4.5" stroke-dasharray="12 10" marker-end="url(#ah)"/>
  <g>
    <g stroke="#1A1520" stroke-width="4" stroke-linecap="round" opacity="0.5">
      <line x1="492" y1="148" x2="522" y2="150"/>
      <line x1="496" y1="172" x2="526" y2="172"/>
    </g>
    <circle cx="560" cy="160" r="30" fill="#EE978E" stroke="#1A1520" stroke-width="5"/>
    <circle cx="648" cy="186" r="30" fill="#8BD9C3" stroke="#1A1520" stroke-width="5"/>
    <circle cx="722" cy="228" r="30" fill="#CCCCFF" stroke="#1A1520" stroke-width="5"/>
  </g>
  <path d="M770,300 A52,52 0 0 1 874,300 L874,312 L770,312 Z" fill="#1A1520"/>

  <!-- Goal pill -->
  <g transform="translate(85,470)">
    <rect x="6" y="6" width="240" height="66" rx="33" fill="#1A1520"/>
    <rect x="0" y="0" width="240" height="66" rx="33" fill="#D4DF68" stroke="#1A1520" stroke-width="5"/>
    <text x="120" y="43" font-family="'Courier New', monospace" font-weight="bold" font-size="28" fill="#1A1520" text-anchor="middle">GOAL 500</text>
  </g>

  <!-- Lives -->
  <g transform="translate(560,455)">
    <g transform="translate(0,0)">
      <path d="M0,14 C0,-8 -34,-8 -34,14 C-34,34 -6,46 0,58 C6,46 34,34 34,14 C34,-8 0,-8 0,14 Z" fill="#EE978E" stroke="#1A1520" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <g transform="translate(96,0)">
      <path d="M0,14 C0,-8 -34,-8 -34,14 C-34,34 -6,46 0,58 C6,46 34,34 34,14 C34,-8 0,-8 0,14 Z" fill="#EE978E" stroke="#1A1520" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <g transform="translate(192,0)" opacity="0.5">
      <path d="M0,14 C0,-8 -34,-8 -34,14 C-34,34 -6,46 0,58 C6,46 34,34 34,14 C34,-8 0,-8 0,14 Z" fill="none" stroke="#1A1520" stroke-width="5" stroke-dasharray="8 7" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
