<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <!-- Impact feedback: collision burst, rings, debris, decal, camera shake -->
  <defs>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="2.2" fill="#1A1520" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="900" height="600" fill="#FFFDF8"/>
  <rect width="900" height="600" fill="url(#dots)"/>

  <!-- Camera shake frame -->
  <g stroke="#1A1520" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M110,140 L110,90 L160,90"/>
    <path d="M740,90 L790,90 L790,140"/>
    <path d="M790,460 L790,510 L740,510"/>
    <path d="M160,510 L110,510 L110,460"/>
  </g>
  <g stroke="#1A1520" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.28">
    <path d="M122,146 L122,102 L164,102"/>
    <path d="M736,78 L778,78 L778,122"/>
    <path d="M802,454 L802,498 L748,498"/>
    <path d="M152,522 L98,522 L98,472"/>
  </g>

  <!-- Decal under the impact -->
  <ellipse cx="450" cy="472" rx="150" ry="30" fill="#1A1520" opacity="0.15"/>
  <ellipse cx="330" cy="482" rx="34" ry="10" fill="#1A1520" opacity="0.12"/>
  <ellipse cx="586" cy="480" rx="26" ry="8" fill="#1A1520" opacity="0.12"/>

  <!-- Impact rings -->
  <circle cx="450" cy="290" r="118" fill="none" stroke="#1A1520" stroke-width="3.5" stroke-dasharray="8 10" opacity="0.5"/>
  <circle cx="450" cy="290" r="160" fill="none" stroke="#1A1520" stroke-width="3" stroke-dasharray="5 12" opacity="0.3"/>

  <!-- Incoming ball -->
  <g stroke="#1A1520" stroke-width="4" stroke-linecap="round" opacity="0.5">
    <line x1="160" y1="270" x2="250" y2="276"/>
    <line x1="146" y1="306" x2="236" y2="306"/>
  </g>
  <circle cx="330" cy="296" r="56" fill="#FFFDF8" stroke="#1A1520" stroke-width="5.5"/>
  <circle cx="548" cy="282" r="56" fill="#EE978E" stroke="#1A1520" stroke-width="5.5"/>

  <!-- Burst -->
  <g transform="translate(442,286)">
    <g transform="translate(6,6)">
      <path d="M0,-84 L14,-38 L58,-58 L34,-16 L84,-8 L38,10 L62,52 L18,36 L8,84 L-12,40 L-52,62 L-32,18 L-84,12 L-40,-10 L-60,-50 L-18,-34 Z" fill="#1A1520"/>
    </g>
    <path d="M0,-84 L14,-38 L58,-58 L34,-16 L84,-8 L38,10 L62,52 L18,36 L8,84 L-12,40 L-52,62 L-32,18 L-84,12 L-40,-10 L-60,-50 L-18,-34 Z" fill="#FABA32" stroke="#1A1520" stroke-width="5" stroke-linejoin="round"/>
    <circle r="20" fill="#FFFDF8" stroke="#1A1520" stroke-width="4"/>
  </g>

  <!-- Debris -->
  <g fill="#EE978E" stroke="#1A1520" stroke-width="3" stroke-linejoin="round">
    <path d="M300,160 l20,-8 l-4,20 Z"/>
    <path d="M600,150 l18,10 l-20,8 Z"/>
    <path d="M640,380 l16,-12 l4,20 Z"/>
    <path d="M262,382 l-18,8 l14,12 Z"/>
  </g>
  <g fill="#8BD9C3" stroke="#1A1520" stroke-width="3">
    <circle cx="360" cy="140" r="8"/>
    <circle cx="560" cy="420" r="8"/>
    <circle cx="240" cy="220" r="7"/>
    <circle cx="666" cy="240" r="7"/>
  </g>
</svg>
