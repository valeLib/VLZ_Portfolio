<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <!-- Material effects: layered shell materials compose onto the ball -->
  <defs>
    <pattern id="dots" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="22" r="2.2" fill="#1A1520" opacity="0.07"/>
    </pattern>
    <clipPath id="ballclip">
      <circle cx="0" cy="0" r="112"/>
    </clipPath>
    <clipPath id="overlayclip">
      <circle cx="0" cy="0" r="48"/>
    </clipPath>
  </defs>
  <rect width="900" height="600" fill="#FFFDF8"/>
  <rect width="900" height="600" fill="url(#dots)"/>

  <!-- Layer stack -->
  <g stroke="#1A1520" stroke-width="3.5" stroke-dasharray="9 8" opacity="0.5" fill="none">
    <path d="M232,140 C340,160 420,210 492,252"/>
    <path d="M232,300 C320,300 400,300 470,300"/>
    <path d="M232,460 C340,440 420,390 492,348"/>
  </g>

  <!-- Base layer -->
  <g transform="translate(172,140)">
    <circle cx="5" cy="5" r="52" fill="#1A1520"/>
    <circle r="52" fill="#FFFDF8" stroke="#1A1520" stroke-width="5"/>
    <ellipse cx="-16" cy="-18" rx="13" ry="8" fill="#1A1520" opacity="0.1" transform="rotate(-30 -16 -18)"/>
  </g>
  <!-- Overlay layer -->
  <g transform="translate(172,300)">
    <circle cx="5" cy="5" r="52" fill="#1A1520"/>
    <circle r="52" fill="#EE978E" stroke="#1A1520" stroke-width="5"/>
    <g clip-path="url(#overlayclip)" stroke="#1A1520" stroke-width="3.5" opacity="0.55">
      <line x1="-60" y1="30" x2="30" y2="-60"/>
      <line x1="-40" y1="52" x2="52" y2="-40"/>
      <line x1="-16" y1="66" x2="66" y2="-16"/>
      <line x1="8" y1="76" x2="76" y2="8"/>
    </g>
  </g>
  <!-- Rim / fresnel layer -->
  <g transform="translate(172,460)">
    <circle cx="5" cy="5" r="52" fill="#1A1520"/>
    <circle r="52" fill="#F5EEE6" stroke="#1A1520" stroke-width="5"/>
    <path d="M-36,-30 A46,46 0 0 1 34,-32" fill="none" stroke="#8BD9C3" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Composed ball -->
  <g transform="translate(618,300)">
    <!-- emissive rays -->
    <g stroke="#FABA32" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-138" x2="0" y2="-162"/>
      <line x1="98" y1="-98" x2="115" y2="-115"/>
      <line x1="138" y1="0" x2="162" y2="0"/>
      <line x1="98" y1="98" x2="115" y2="115"/>
      <line x1="0" y1="138" x2="0" y2="162"/>
      <line x1="-98" y1="98" x2="-115" y2="115"/>
      <line x1="-138" y1="0" x2="-162" y2="0"/>
      <line x1="-98" y1="-98" x2="-115" y2="-115"/>
    </g>
    <circle cx="8" cy="8" r="112" fill="#1A1520"/>
    <circle r="112" fill="#FFFDF8" stroke="#1A1520" stroke-width="6"/>
    <g clip-path="url(#ballclip)">
      <path d="M-130,52 C-90,12 -50,82 0,42 C50,2 90,72 130,32" fill="none" stroke="#EE978E" stroke-width="16" stroke-linecap="round"/>
      <path d="M-130,96 C-90,56 -50,126 0,86 C50,46 90,116 130,76" fill="none" stroke="#EE978E" stroke-width="16" stroke-linecap="round" opacity="0.65"/>
    </g>
    <path d="M-80,-64 A104,104 0 0 1 76,-68" fill="none" stroke="#8BD9C3" stroke-width="15" stroke-linecap="round"/>
  </g>
</svg>
